#!/usr/sbin/nft -f
flush ruleset

define IRAN = ${IRAN_IP}

table inet vpn {
    set cf4 {
        type ipv4_addr
        flags interval
        elements = {
            173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22,
            141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20,
            197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13,
            104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22
        }
    }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iif "lo" accept
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
        tcp dport 22 accept
        tcp dport 80 accept
        tcp dport 2096 accept
        # Public 443 is nginx SNI preread (panel hostnames → :2096, else XHTTP).
        tcp dport 443 accept
        tcp dport 9443 ip saddr $IRAN accept
        tcp dport 8444 ip saddr $IRAN accept
        udp dport { 443, 4443, 8443, 50000 } ip saddr $IRAN accept
        counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        iif "lo" accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip raw {
    chain PREROUTING {
        type filter hook prerouting priority raw; policy accept;
        iifname != "lo" meta l4proto tcp ip daddr 127.0.0.1 tcp dport 8000 drop
    }
}
