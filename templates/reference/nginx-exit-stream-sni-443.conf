# Exit TCP 443 SNI router (ssl_preread). Does not terminate TLS.
# Public 443 → nginx stream → panel :2096 or XHTTP on 127.0.0.1:10443.
#
# Reality/Vision client inbounds stay on Iran. Do not send dl.google.com here.

map $ssl_preread_server_name $sni_backend {
    ${PANEL_DOMAIN}      127.0.0.1:2096;
    ${PANEL_DOMAIN_ALT}    127.0.0.1:2096;
    ${PANEL_DOMAIN_EXTRA}     127.0.0.1:2096;
    default                 127.0.0.1:10443;
}

log_format sni_preread '$remote_addr [$time_local] sni=$ssl_preread_server_name -> $sni_backend';

server {
    listen 443 reuseport;
    listen [::]:443 ipv6only=on reuseport;
    ssl_preread on;
    preread_timeout 5s;
    proxy_pass $sni_backend;
    proxy_connect_timeout 5s;
    proxy_timeout 24h;
    access_log /var/log/nginx/stream-sni.log sni_preread;
}
