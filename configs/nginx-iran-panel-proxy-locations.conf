# Reverse-proxy the whole panel vhost through xray-subproxy (127.0.0.1:10444).
# PasarGuard dashboard HTML loads JS/CSS from /statics/* plus /manifest.webmanifest
# and talks to /api/. Proxying only /dashboard produced a blank white page.

location / {
    proxy_pass                    https://127.0.0.1:10444;
    proxy_http_version            1.1;
    proxy_ssl_server_name         on;
    proxy_ssl_name                ${PANEL_DOMAIN_ALT};
    # Loopback to dokodemo; LE chain via tunnel trips nginx "certificate chain too long".
    proxy_ssl_verify              off;
    proxy_set_header Host              ${PANEL_DOMAIN_ALT};
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header User-Agent        $http_user_agent;
    proxy_set_header Cookie            $http_cookie;
    proxy_set_header X-HWID            $http_x_hwid;
    proxy_set_header X-Device-OS       $http_x_device_os;
    proxy_set_header X-Ver-OS          $http_x_ver_os;
    proxy_set_header X-Device-Model    $http_x_device_model;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout            3600s;
    client_max_body_size          32m;
}
