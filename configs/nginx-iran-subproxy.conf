# Iran-local TLS reverse proxy for the panel.
# :443 stays Reality. :8443 is the explicit ir.* path. :2096 is the
# transparent path for saved client URLs (${PANEL_DOMAIN_ALT}:2096/...).
# Upstream is 127.0.0.1:10444 (xray-subproxy → SOCKS 11080 → backhaul → panel).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name ${IRAN_DOMAIN_ALT} ${IRAN_DOMAIN};

    include /etc/nginx/snippets/iran-panel-ssl.conf;
    include /etc/nginx/snippets/iran-panel-proxy-locations.conf;
}

server {
    listen 2096 ssl http2;
    listen [::]:2096 ssl http2;
    server_name ${PANEL_DOMAIN_ALT};

    include /etc/nginx/snippets/iran-panel-ssl.conf;
    include /etc/nginx/snippets/iran-panel-proxy-locations.conf;
}
