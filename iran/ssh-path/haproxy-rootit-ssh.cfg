
# RoOtIt TO-AMS-SSH: spread SOCKS connections over 4 SSH tunnels
listen rootit_ssh_socks
	bind 127.0.0.1:18300
	mode tcp
	balance leastconn
	timeout connect 3s
	timeout client 1h
	timeout server 1h
	server t1 127.0.0.1:18301 check inter 3s fall 2 rise 2
	server t2 127.0.0.1:18302 check inter 3s fall 2 rise 2
	server t3 127.0.0.1:18303 check inter 3s fall 2 rise 2
	server t4 127.0.0.1:18304 check inter 3s fall 2 rise 2
