
# RoOtIt TO-NL-SSH: MobinHost NL SOCKS via 4 SSH tunnels (when WaterWall + direct NL fail)
listen rootit_ssh_socks_nl
	bind 127.0.0.1:18400
	mode tcp
	balance leastconn
	timeout connect 3s
	timeout client 1h
	timeout server 1h
	server t1 127.0.0.1:18401 check inter 3s fall 2 rise 2
	server t2 127.0.0.1:18402 check inter 3s fall 2 rise 2
	server t3 127.0.0.1:18403 check inter 3s fall 2 rise 2
	server t4 127.0.0.1:18404 check inter 3s fall 2 rise 2
